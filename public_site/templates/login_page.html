{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrap" style="min-height:auto;padding:24px 0;">
  <div class="auth-box">
    <div class="auth-header">
      <div class="logo">&#x2B21;</div>
      <h1>Login</h1>
      <p>Access your saved collection</p>
    </div>
    <div class="auth-body">
      {% if error %}<div class="alert alert-err">{{ error }}</div>{% endif %}
      <form method="POST">
        <div class="form-group"><label>Username</label><input class="form-control" name="username" required autofocus></div>
        <div class="form-group"><label>Password</label><input class="form-control" type="password" name="password" required></div>
        <button type="submit" class="btn btn-primary btn-full" style="padding:12px;">Login</button>
      </form>
      <p style="text-align:center;margin-top:14px;font-size:12px;color:var(--text-muted);">No account? <a href="{{ url_for('register') }}">Register</a> or <a href="{{ url_for('index') }}">browse without one</a></p>
    </div>
  </div>
</div>
{% endblock %}
